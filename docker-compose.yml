# Sobe as duas APIs juntas: docker compose up --build
# Pré-requisito: os dois repositórios clonados LADO A LADO na mesma pasta:
#   pasta/
#     conecta_ciclovias_api_principal/   <- este repositório (rode o compose aqui)
#     conecta_ciclovias_api_secundaria/
services:
  secundaria:
    build: ../conecta_ciclovias_api_secundaria
    ports:
      - "8000:8000"

  principal:
    build: .
    ports:
      - "5000:5000"
    environment:
      # dentro da rede do compose, a secundária é encontrada pelo nome do serviço
      SECUNDARIA_URL: http://secundaria:8000
    volumes:
      # o banco SQLite sobrevive quando o container é recriado
      - banco_principal:/app/db
    depends_on:
      - secundaria

volumes:
  banco_principal:
